<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso de administración | Dulces Delicias</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#FAF6E9] text-stone-800 flex flex-col">
  <header class="border-b border-[#F3E8C9] bg-[#FFFDF5]">
    <div class="mx-auto flex max-w-5xl items-center justify-between p-4">
      <a href="index.html" class="text-2xl font-bold text-[#8B4513]">🥐 Dulces Delicias</a>
      <a href="index.html" class="text-sm font-medium text-[#D97706] hover:underline">Volver a la tienda</a>
    </div>
  </header>
  <main class="mx-auto flex w-full max-w-md flex-1 items-center px-4 py-10">
    <section class="w-full rounded-2xl border border-[#F3E8C9] bg-white p-7 shadow-sm">
      <div class="mb-6 text-center">
        <div class="mx-auto mb-3 grid h-14 w-14 place-items-center rounded-full bg-amber-100 text-2xl">🔐</div>
        <h1 class="text-2xl font-extrabold text-[#512B11]">Acceso de administración</h1>
        <p class="mt-2 text-sm text-stone-500">Inicia sesión para entrar al panel de la panadería.</p>
      </div>
      <form data-admin-login class="space-y-4">
        <div>
          <label for="admin-email" class="mb-1 block text-sm font-medium text-stone-700">Correo electrónico</label>
          <input id="admin-email" name="email" type="email" autocomplete="username" required
            class="w-full rounded-lg border border-stone-300 px-3 py-2.5 focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200">
        </div>
        <div>
          <label for="admin-password" class="mb-1 block text-sm font-medium text-stone-700">Contraseña</label>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required
            class="w-full rounded-lg border border-stone-300 px-3 py-2.5 focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200">
        </div>
        <p data-login-error role="alert" class="hidden rounded-lg bg-red-50 p-3 text-sm text-red-700"></p>
        <button type="submit" class="w-full rounded-lg bg-amber-600 px-4 py-3 font-semibold text-white hover:bg-amber-700">
          Iniciar sesión
        </button>
      </form>
      <div class="mt-5 rounded-lg bg-amber-50 p-3 text-xs text-stone-600">
        <p class="font-semibold text-amber-900">Credenciales de demostración</p>
        <p>Correo: admin@dulcesdelicias.com</p>
        <p>Contraseña: Admin123!</p>
      </div>
    </section>
  </main>
  <footer class="border-t border-[#F3E8C9] bg-[#FFFDF5] p-4 text-center text-xs text-stone-500">
    Dulces Delicias · Panel administrativo
  </footer>
  <script src="app.js"></script>
</body>
</html>
