<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto - Dulces Delicias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF6E9] text-stone-800 font-sans min-h-screen flex flex-col">

    <header class="bg-[#FFFDF5] border-b border-[#F3E8C9] p-4">
        <div class="mx-auto max-w-5xl flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-[#8B4513]">🥐 Dulces Delicias</a>
            <a href="catalogo.html" class="text-xs font-bold text-[#D97706]">← Volver al Catálogo</a>
        </div>
    </header>

    <main class="mx-auto max-w-4xl px-4 py-10 flex-1 w-full">
        <div class="bg-white border border-[#F3E8C9] rounded-2xl p-6 shadow-sm grid md:grid-cols-2 gap-8">
            <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=600&auto=format&fit=crop" alt="Concha de Vainilla" class="w-full h-72 object-cover rounded-xl">
            
            <div class="flex flex-col justify-between">
                <div>
                    <span class="bg-[#FEF3C7] text-[#B45309] text-[10px] font-bold px-2 py-1 rounded uppercase">Pan Dulce Tradicional</span>
                    <h1 class="text-2xl font-extrabold text-[#512B11] mt-2">Concha de Vainilla</h1>
                    <p class="text-2xl font-black text-[#D97706] mt-1">$15.30 <span class="text-xs text-stone-400 line-through font-normal">$18.00</span></p>
                    
                    <!-- Información para decidir la compra -->
                    <div class="mt-4 space-y-2 border-t border-stone-100 pt-3 text-xs text-stone-600">
                        <p><strong>Ingredientes:</strong> Harina de trigo orgánica, mantequilla, masa madre, azúcar y vainilla natural.</p>
                        <p><strong>Alérgenos:</strong> Contiene gluten y derivados lácteos.</p>
                        <p><strong>Estado:</strong> <span class="text-emerald-600 font-bold">Horneado hoy a las 6:00 AM</span></p>
                    </div>
                </div>

                <div class="mt-6 flex gap-3">
                    <input type="number" value="1" min="1" class="w-16 border border-stone-300 rounded-lg text-center font-bold">
                    <button class="flex-1 bg-[#D97706] hover:bg-[#B45309] text-white font-bold py-3 rounded-lg text-sm">Agregar al Carrito</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
