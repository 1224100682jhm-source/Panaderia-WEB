<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promociones - Dulces Delicias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF6E9] text-stone-800 font-sans min-h-screen flex flex-col">

    <header class="bg-[#FFFDF5] border-b border-[#F3E8C9] sticky top-0 z-50">
        <div class="mx-auto flex max-w-7xl items-center justify-between p-4">
            <a href="index.html" class="text-2xl font-bold text-[#8B4513]">🥐 Dulces Delicias</a>
            <nav class="hidden md:flex gap-6 text-sm font-medium">
                <a href="index.html" class="text-stone-600 hover:text-[#D97706]">Inicio</a>
                <a href="catalogo.html" class="text-stone-600 hover:text-[#D97706]">Catálogo</a>
                <a href="categorias.html" class="text-stone-600 hover:text-[#D97706]">Categorías</a>
                <a href="promociones.html" class="text-[#D97706] font-bold border-b-2 border-[#D97706] pb-1">Promociones 🏷️</a>
            </nav>
            <div class="flex items-center gap-2">
                <a href="carrito.html" class="flex items-center gap-2 rounded-lg bg-[#D97706] px-4 py-2 text-sm font-semibold text-white hover:bg-[#B45309] transition">
                    🛒 Mi Carrito <span data-cart-count class="bg-white text-[#D97706] text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </a>
                <a data-customer-login-link href="iniciar_sesion.html" class="flex items-center gap-2 rounded-lg border border-[#D97706] px-4 py-2 text-sm font-semibold text-[#D97706] hover:bg-[#FEF3C7] transition">
                    👤 Iniciar sesión
                </a>
                <a data-customer-profile-link href="perfil.html" class="hidden flex items-center gap-2 rounded-lg border border-[#D97706] px-4 py-2 text-sm font-semibold text-[#D97706] hover:bg-[#FEF3C7] transition">
                    👤 Mi perfil
                </a>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8 flex-1 w-full">
        <div class="bg-[#FEE2E2] border border-[#FECACA] p-6 rounded-2xl mb-8">
            <h1 class="text-2xl font-extrabold text-[#DC2626]">🏷️ Promociones de la Semana</h1>
            <p class="text-xs text-stone-600 mt-1">Aprovecha nuestras promociones en productos disponibles.</p>
        </div>
        <p class="mb-4 text-sm text-stone-600">Estas promociones se muestran mientras el producto esté visible y tenga existencias.</p>
        <div data-promotion-list class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>
  <script src="app.js"></script>
</body>
</html>
