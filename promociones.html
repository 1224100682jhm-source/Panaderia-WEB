<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promociones - Dulces Delicias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF6E9] text-stone-800 font-sans min-h-screen flex flex-col">

    <header class="bg-[#FFFDF5] border-b border-[#F3E8C9] p-4">
        <div class="mx-auto max-w-7xl flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-[#8B4513]">🥐 Dulces Delicias</a>
            <a href="catalogo.html" class="text-xs font-bold text-[#D97706]">← Catálogo</a>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8 flex-1 w-full">
        <div class="bg-[#FEE2E2] border border-[#FECACA] p-6 rounded-2xl mb-8">
            <h1 class="text-2xl font-extrabold text-[#DC2626]">🏷️ Promociones de la Semana</h1>
            <p class="text-xs text-stone-600 mt-1">Aprovecha nuestros descuentos especiales en productos seleccionados.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <article class="bg-white rounded-2xl border border-[#F3E8C9] p-5 shadow-sm">
                <span class="bg-[#DC2626] text-white text-[10px] font-bold px-2 py-1 rounded">15% DESCUENTO</span>
                <h3 class="font-bold text-lg text-[#512B11] mt-2">Concha de Vainilla</h3>
                <p class="text-sm font-bold text-[#D97706]">$15.30 <span class="text-xs text-stone-400 line-through">$18.00</span></p>
                <button class="w-full mt-4 bg-[#D97706] text-white text-xs font-bold py-2 rounded-lg">Aprovechar Oferta</button>
            </article>
        </div>
    </main>
</body>
</html>
