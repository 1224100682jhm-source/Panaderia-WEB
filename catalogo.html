<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Dulces Delicias</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF6E9] text-stone-800 font-sans min-h-screen flex flex-col">

    <header class="bg-[#FFFDF5] border-b border-[#F3E8C9] sticky top-0 z-50">
        <div class="mx-auto flex max-w-7xl items-center justify-between p-4">
            <a href="index.html" class="text-2xl font-bold text-[#8B4513]">🥐 Dulces Delicias</a>
            <nav class="hidden md:flex gap-6 text-sm font-medium">
                <a href="index.html" class="text-stone-600 hover:text-[#D97706]">Inicio</a>
                <a href="catalogo.html" class="text-[#D97706] font-bold border-b-2 border-[#D97706] pb-1">Catálogo</a>
                <a href="categorias.html" class="text-stone-600 hover:text-[#D97706]">Categorías</a>
                <a href="promociones.html" class="text-stone-600 hover:text-[#D97706]">Promociones 🏷️</a>
            </nav>
            <a href="carrito.html" class="flex items-center gap-2 rounded-lg bg-[#D97706] px-4 py-2 text-sm font-semibold text-white">
                🛒 Mi Carrito <span data-cart-count class="bg-white text-[#D97706] text-xs font-bold px-2 py-0.5 rounded-full">0</span>
            </a>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8 flex-1 w-full">
        <h1 class="text-3xl font-extrabold text-[#512B11] mb-2">Catálogo Completo de Productos</h1>
        <p class="text-stone-600 text-sm mb-6">Disponibilidad en tiempo real para tus pedidos.</p>

        <section data-product-list class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></section>
    </main>
</body>
</html>
